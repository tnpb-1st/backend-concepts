spring:
  application:
    name: blogapi
  datasource:
    url: jdbc:h2:mem:blogapi;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

server:
  address: 127.0.0.1
